[workspace]
name = "sphero-monash-ros"
version = "0.1.0"
description = "ROS2 wrapper for Sphero simulator and hardware"
channels = ["conda-forge", "robostack-humble"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.13"
pip = "*"
setuptools = ">=61"
numpy = "*"
pandas = "*"
pytest = "*"
gymnasium = ">=0.29"
ros-humble-ros-base = "*"
ros-humble-rviz2 = "*"
ros-humble-rclpy = "*"
ros-humble-robot-state-publisher = "*"
ros-humble-geometry-msgs = "*"
ros-humble-nav-msgs = "*"
ros-humble-tf2-ros = "*"

[tasks]
sim-node = "PYTHONPATH=src python -m sphero_ros.nodes.sim_wrapper_node"
robot-node = "PYTHONPATH=src python -m sphero_ros.nodes.robot_wrapper_node"
teleop-node = "PYTHONPATH=src python -m sphero_ros.nodes.teleop_node"
sim-launch = "ros2 launch ./launch/sphero_sim.launch.py"
robot-launch = "ros2 launch ./launch/sphero_robot.launch.py"
rviz = "rviz2 -d rviz/sphero_pose.rviz"
develop = "pip install -e ."
